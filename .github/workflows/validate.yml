name: validate

# The job named `validate` is the check the `main` ruleset requires. Rename
# both together or merges stop. deploy.yml follows this workflow by name.

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      # Production dependencies must be clean; the dev toolchain is
      # reported, not gated (the same posture as elixir-mcp).
      - run: npm audit --omit=dev --audit-level=low
      - run: npm audit || true
      - name: Workflow lint
        run: sh scripts/test-workflows.sh
      # No network, no spend: every seam is a fake in the tests.
      - run: npm run verify
      - run: npm run build
      - run: node infra/scripts/build.mjs
      # Journeys against the built app with route fixtures (no Lambda):
      # the real bundle, the real router, the kit from the pinned
      # dependency, axe on every page a journey lands on.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
