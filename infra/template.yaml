AWSTemplateFormatVersion: "2010-09-09"
Description: elixir-clan - Elixir Clan at clan.poapkings.com, a vertical on Elixir (unofficial, not endorsed by Supercell)

# One stack, one bucket, one function (docs/NOTES.md). No VPC, no NAT, no
# extra roles: the Lambda talks to Elixir over the public internet the way
# any third-party client does, and to one DynamoDB table. The cookie
# signing secret arrives through a Secrets Manager dynamic reference and
# never appears in a parameter, a log or a repo.

Parameters:
  CodeBucket:
    Type: String
    Description: S3 bucket holding the Lambda bundle (created by bootstrap)
  ApiCodeKey:
    Type: String
    Description: Content-addressed key of the API bundle in CodeBucket
  AppUrl:
    Type: String
    Default: ""
    Description: >-
      The origin the app is served from, no trailing slash. The CloudFront
      default hostname until DNS lands, then https://clan.poapkings.com.
      Decides the OAuth redirect_uri and every redirect back to the app.
      PRESERVED across deploys.
  ElixirUrl:
    Type: String
    Default: https://elixir.poapkings.com
    Description: Elixir's issuer and site; Clan reads its JSON API at ElixirUrl/api/v1. PRESERVED.
  OAuthClientId:
    Type: String
    Default: ""
    Description: >-
      The client_id Elixir issued at /oauth/register (infra/scripts/register-client.mjs).
      Public client, no secret. A registration lives 365 days from last use;
      re-register and set this again if Elixir reports it unknown. PRESERVED.
  AppSecretName:
    Type: String
    Default: elixir-clan/app
    Description: Secrets Manager secret with session_secret (created by bootstrap). PRESERVED.
  SiteCertificateArn:
    Type: String
    Default: ""
    Description: >-
      ACM certificate in us-east-1 covering clan.poapkings.com (the account's
      *.poapkings.com wildcard). Empty deploys without the alias. PRESERVED.
  MaintainerTags:
    Type: String
    Default: ""
    Description: >-
      Comma-separated VERIFIED player tags of the product's maintainer(s),
      who answer feedback (the maintainer lane at /maintain). Not a clan
      role: the product's. Empty means nobody. PRESERVED.
  FeedbackNotifyEmail:
    Type: String
    Default: ""
    Description: >-
      An address to subscribe to the feedback topic (new feedback, one
      message each; SNS asks it to confirm once). Empty means no
      subscription; the topic exists either way. PRESERVED.

  ElixirIntegrationKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: >-
      Elixir Clan's own Elixir integration key (svt_, permission clans:read),
      for the morning evaluation with nobody signed in. Minted locally and
      staged with --param once; its value is never printed. Empty means no
      scheduled evaluation. PRESERVED.
  ScheduleEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Whether the daily evaluation rule exists. Stays false until the
      execution role may manage an EventBridge rule (infra/IAM.md);
      then set true once. PRESERVED.

Conditions:
  HasSiteCert: !Not [!Equals [!Ref SiteCertificateArn, ""]]
  HasFeedbackEmail: !Not [!Equals [!Ref FeedbackNotifyEmail, ""]]
  HasSchedule: !Equals [!Ref ScheduleEnabled, "true"]

Resources:
  # ------------------------------------------------------------ durable state
  # Pending logins and sessions expire through TTL, while policy versions,
  # cards, holds, notes, awards and feedback remain durable. The table is
  # encrypted with the AWS-managed DynamoDB KMS key, retained by the stack,
  # protected from deletion, and recoverable to any second in the last 35 days.
  SessionTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: elixir-clan
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      # The clan ledger (second push): policy versions, cards, holds, notes
      # and the verdict snapshot are items of one clan, listed through this
      # index (gsi1pk = clan#<tag>, gsi1sk = <kind>#...). Added to the live
      # table without replacing it.
      GlobalSecondaryIndexes:
        - IndexName: ByClan
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
        RecoveryPeriodInDays: 35

  # ------------------------------------------------------------ the function
  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: elixir-clan-api
      PermissionsBoundary: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/elixir-clan-runtime-boundary
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: elixir-clan-api
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/elixir-clan-api:*
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:BatchWriteItem
                Resource:
                  - !GetAtt SessionTable.Arn
                  - !Sub ${SessionTable.Arn}/index/ByClan
              - Effect: Allow
                Action: [sns:Publish]
                Resource: !Ref FeedbackTopic

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/elixir-clan-api
      RetentionInDays: 30

  ApiFunction:
    Type: AWS::Lambda::Function
    DependsOn: ApiLogGroup
    Properties:
      FunctionName: elixir-clan-api
      Description: Elixir Clan - OAuth with Elixir, the gate, sessions, the roster read
      Runtime: nodejs24.x
      Architectures: [arm64]
      Handler: index.handler
      MemorySize: 256
      Timeout: 25
      # A ceiling on a runaway client or a bill, far above real traffic.
      ReservedConcurrentExecutions: 10
      Role: !GetAtt ApiRole.Arn
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref ApiCodeKey }
      Environment:
        Variables:
          TABLE_NAME: !Ref SessionTable
          APP_URL: !Ref AppUrl
          ELIXIR_URL: !Ref ElixirUrl
          OAUTH_CLIENT_ID: !Ref OAuthClientId
          SESSION_SECRET: !Sub "{{resolve:secretsmanager:${AppSecretName}:SecretString:session_secret}}"
          MAINTAINER_TAGS: !Ref MaintainerTags
          FEEDBACK_TOPIC_ARN: !Ref FeedbackTopic
          ELIXIR_INTEGRATION_KEY: !Ref ElixirIntegrationKey

  # The HTTP API, spelled out (2026-09-12): the quick-create form
  # (`Target`) owns its own $default stage, and a stage owned that way
  # cannot carry access logs. These four resources are what quick-create
  # made implicitly, plus the access log: one JSON line per request in
  # front of the Lambda, with the gateway's own integration and response
  # latency, which is the only place a 29-second gateway timeout or a
  # Lambda that never answered is written down.
  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: elixir-clan-api
      ProtocolType: HTTP

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 29000

  ApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: $default
      Target: !Sub integrations/${ApiIntegration}

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/apigateway/elixir-clan-api
      RetentionInDays: 30

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref Api
      StageName: $default
      AutoDeploy: true
      # Fourteen days of access logs peaked at 6 requests/second. These
      # ceilings preserve natural bursts while bounding runaway clients.
      DefaultRouteSettings:
        DetailedMetricsEnabled: false
        ThrottlingRateLimit: 10
        ThrottlingBurstLimit: 20
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        # No viewer address: CloudFront is the caller, so it would be an
        # edge node. The gateway's request id joins this line to the
        # Lambda's own (request_id there).
        Format: >-
          {"at":"$context.requestTime","request_id":"$context.requestId","method":"$context.httpMethod","path":"$context.path","status":"$context.status","integration_status":"$context.integrationStatus","integration_ms":"$context.integrationLatency","response_ms":"$context.responseLatency","bytes":"$context.responseLength","error":"$context.error.message","integration_error":"$context.integrationErrorMessage","user_agent":"$context.identity.userAgent"}

  HttpApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*

  # The morning evaluation (2026-09-25, door 1): every clan with a
  # policy is evaluated from 11:00 UTC (06:00 Central in summer, 05:00 in
  # winter), after the war day's reset, on Clan's own Elixir integration
  # key, so actions wait for leaders and a closed season's awards are
  # granted without anyone visiting. One clan per invocation (Jamie,
  # 2026-09-26): the rule fires every two minutes through the hour and each
  # invocation takes the next clan not yet run today (services/api/src/
  # scheduled.mjs), so a clan has the whole time limit to itself and Elixir
  # is never read for every clan at once. Its own function, the API's code
  # and role with a longer limit and one at a time, so the web requests
  # keep their short limit and their duration alarm; it logs into the
  # API's log group, the one the runtime boundary allows.
  EvaluateFunction:
    Type: AWS::Lambda::Function
    Condition: HasSchedule
    DependsOn: ApiLogGroup
    Properties:
      FunctionName: elixir-clan-evaluate
      Description: Elixir Clan - the morning evaluation, one clan per invocation
      Runtime: nodejs24.x
      Architectures: [arm64]
      Handler: index.handler
      MemorySize: 256
      Timeout: 300
      ReservedConcurrentExecutions: 1
      Role: !GetAtt ApiRole.Arn
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref ApiCodeKey }
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      Environment:
        Variables:
          TABLE_NAME: !Ref SessionTable
          APP_URL: !Ref AppUrl
          ELIXIR_URL: !Ref ElixirUrl
          OAUTH_CLIENT_ID: !Ref OAuthClientId
          SESSION_SECRET: !Sub "{{resolve:secretsmanager:${AppSecretName}:SecretString:session_secret}}"
          MAINTAINER_TAGS: !Ref MaintainerTags
          FEEDBACK_TOPIC_ARN: !Ref FeedbackTopic
          ELIXIR_INTEGRATION_KEY: !Ref ElixirIntegrationKey

  EvaluateSchedule:
    Type: AWS::Events::Rule
    Condition: HasSchedule
    Properties:
      Name: elixir-clan-evaluate
      Description: Elixir Clan - evaluate the clans with a policy, one every two minutes from 11:00 UTC
      ScheduleExpression: cron(0/2 11 * * ? *)
      State: ENABLED
      Targets:
        - Arn: !GetAtt EvaluateFunction.Arn
          Id: evaluate
          Input: '{"scheduled":"evaluate"}'

  EvaluateSchedulePermission:
    Type: AWS::Lambda::Permission
    Condition: HasSchedule
    Properties:
      FunctionName: !Ref EvaluateFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt EvaluateSchedule.Arn

  # ------------------------------------------------------------ the site
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub elixir-clan-web-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  WebOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: elixir-clan-web-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Cookies and the query string flow to the API; nothing is cached.
  ApiOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: elixir-clan-api
        CookiesConfig: { CookieBehavior: all }
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers: [accept, content-type, cloudfront-viewer-country]
        QueryStringsConfig: { QueryStringBehavior: all }

  # Elixir's headers, minus what this site does not load. Every origin
  # here comes from the built output: Inter from Google Fonts (index.html)
  # and nothing else off-site. form-action stays 'self': sign-in is a
  # link that redirects, and the browser does not apply form-action to a
  # redirect that follows a navigation.
  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: elixir-clan-security-headers
        Comment: CSP, HSTS, nosniff, referrer and permissions policy
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: >-
              default-src 'self';
              base-uri 'self';
              object-src 'none';
              frame-ancestors 'none';
              form-action 'self';
              script-src 'self' https://tinylytics.app;
              connect-src 'self' https://tinylytics.app;
              img-src 'self' data: https://tinylytics.app https://tile.openstreetmap.org;
              font-src 'self' https://fonts.gstatic.com;
              style-src 'self' 'unsafe-inline' https://fonts.googleapis.com
          ContentTypeOptions:
            Override: true
          FrameOptions:
            Override: true
            FrameOption: DENY
          ReferrerPolicy:
            Override: true
            ReferrerPolicy: strict-origin-when-cross-origin
          StrictTransportSecurity:
            Override: true
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: false
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Override: true
              Value: >-
                accelerometer=(), camera=(), display-capture=(),
                geolocation=(), gyroscope=(), magnetometer=(),
                microphone=(), payment=(), usb=()

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: clan.poapkings.com
        HttpVersion: http2and3
        Aliases: !If [HasSiteCert, [clan.poapkings.com], !Ref "AWS::NoValue"]
        ViewerCertificate: !If
          - HasSiteCert
          - AcmCertificateArn: !Ref SiteCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        DefaultRootObject: index.html
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !Ref WebOac
            S3OriginConfig: { OriginAccessIdentity: "" }
          - Id: api
            DomainName: !Sub ${Api}.execute-api.${AWS::Region}.amazonaws.com
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          # AWS managed CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRouter.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /auth/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            # AWS managed CachingDisabled
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
        # No CustomErrorResponses: they are distribution-wide and would
        # rewrite the API's own refusals into a 200 app shell (Elixir
        # learned this the hard way). The router below owns the SPA.

  # Every extension-less path is the app; a path with an extension is a
  # file and a missing one stays a 404.
  SpaRouter:
    Type: AWS::CloudFront::Function
    Properties:
      Name: elixir-clan-spa-router
      AutoPublish: true
      FunctionConfig:
        Comment: Serve the app shell for every application route
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.substring(uri.lastIndexOf('/') + 1).indexOf('.') !== -1) {
            return request;
          }
          request.uri = '/index.html';
          return request;
        }

  # ------------------------------------------------------------ feedback
  # New feedback, one message each (services/api/src/notify.mjs). The
  # maintainer subscribes an address through FeedbackNotifyEmail; the
  # agent team's Close-the-Loop owner reads the queue by script. Separate
  # from the alarm topic on purpose: feedback is not an incident.
  FeedbackTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: elixir-clan-feedback

  FeedbackEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasFeedbackEmail
    Properties:
      TopicArn: !Ref FeedbackTopic
      Protocol: email
      Endpoint: !Ref FeedbackNotifyEmail

  # ------------------------------------------------------------ monitoring
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: elixir-clan-alarms
      # Routing of record is the sysadmin projects-ops-alerts queue; the
      # subscription and the queue policy entry are made once from
      # infra/scripts/bootstrap.mjs. No email.

  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: elixir-clan-api-errors
      AlarmDescription: The Elixir Clan function is throwing
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref ApiFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # The morning evaluation throwing (a clan's own failure is caught and
  # logged; this is the run itself).
  EvaluateErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasSchedule
    Properties:
      AlarmName: elixir-clan-evaluate-errors
      AlarmDescription: The Elixir Clan morning evaluation is throwing or timing out
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref EvaluateFunction }]
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # A p90 over 8 s for ten minutes is a product that feels broken, whether
  # the time is Elixir's or ours; the request story's log lines say which
  # (services/api/src/trace.mjs). Lambda's own Duration is free and is the
  # request's time, so no custom metric backs this (2026-09-24: the EMF
  # line it used to read had never reached CloudWatch from production).
  SlowRequestsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: elixir-clan-slow-requests
      AlarmDescription: Elixir Clan API requests are slow (p90 over 8 s)
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions: [{ Name: FunctionName, Value: !Ref ApiFunction }]
      ExtendedStatistic: p90
      Period: 300
      EvaluationPeriods: 2
      Threshold: 8000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: elixir-clan-api-5xx
      AlarmDescription: The Elixir Clan HTTP API is answering 5xx
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions: [{ Name: ApiId, Value: !Ref Api }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

Outputs:
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
    Description: CNAME target for clan.poapkings.com at Namecheap
  DistributionId:
    Value: !Ref Distribution
  WebBucketName:
    Value: !Ref WebBucket
  ApiUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com
  ApiFunctionName:
    Value: !Ref ApiFunction
  TableName:
    Value: !Ref SessionTable
  FeedbackTopicArn:
    Value: !Ref FeedbackTopic
  AlarmTopicArn:
    Value: !Ref AlarmTopic
    Description: Subscribed to the sysadmin projects-ops-alerts queue
